rules:

* id: missing-record-authorization-check

  message: >
  Resource is retrieved using a client-supplied identifier and returned
  without an ownership or authorization check. Review for broken access
  control.

  severity: ERROR

  languages:

  * python

  patterns:

  * pattern-inside: |
    def $FUNC(...):
    ...
    $RECORD = db.get_record($ID)
    ...
    return $RECORD

  metadata:
  category: security
  vulnerability: broken-access-control
  confidence: medium
