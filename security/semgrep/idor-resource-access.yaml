rules:
  - id: direct-record-return

    message: >
      Record retrieved by identifier and returned directly.
      Verify ownership or authorization before returning.

    severity: ERROR

    languages:
      - python

    pattern: |
      $RECORD = db.get_record($ID)
      ...
      return $RECORD

    metadata:
      category: security
      vulnerability: broken-access-control
      confidence: medium
