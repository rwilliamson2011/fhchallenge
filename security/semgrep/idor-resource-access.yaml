rules:

- id: direct-record-return-without-authorization

  message: >
  Record retrieved from storage and returned directly.
  Verify ownership or authorization before returning.

  severity: ERROR

  languages:

  - python

  patterns:

  - pattern: |
    $RECORD = db.get_record($ID)
    ...
    return $RECORD

  metadata:
  category: security
  vulnerability: broken-access-control
